name: Mirror Webflow assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/mirror_assets.py
      - run: |
          git config user.name "Ruben Crawford"
          git config user.email "ruben@impact-martialarts.com"
          git add -A
          git diff --cached --quiet || git commit -m "Self-host all Webflow CDN images (mirrored into assets/wf)"
          git push
