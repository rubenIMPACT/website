name: Blog aus dem Google Sheet
on:
  workflow_dispatch:
  schedule:
    - cron: '50 4 * * *'   # taeglich 06:50 Zuerich (Sommerzeit); Quelle: Google Sheet "IMPACT Blog" ueber /api/blog
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 tools/blog_from_api.py
      - run: python3 tools/build_blog.py
      - run: |
          git config user.name "Ruben Crawford"
          git config user.email "ruben@impact-martialarts.com"
          git add -A data/blog.json articles assets/blog sitemap.xml
          git diff --cached --quiet && echo "Keine Aenderung" || { git commit -m "Blog aus dem Sheet nachgezogen ($(date +%d.%m.%Y))"; git pull --rebase; git push; }
